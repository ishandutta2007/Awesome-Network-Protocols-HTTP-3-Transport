<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#0a0f1d;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070b16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#0a1026"/></linearGradient><linearGradient id="cyan-blue" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="purple-pink" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#f857a6"/><stop offset="100%" stop-color="#ff5858"/></linearGradient><linearGradient id="green-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes pulseGlow{0%{r:4px;opacity:.5}}@keyframes floatMotion{0%{transform:translateY(0)}}@keyframes floatMotionAlt{0%{transform:translateY(0)}}.packet-stream{stroke-dasharray:12 180;animation:flowStream 3.5s linear infinite}.packet-stream-fast{stroke-dasharray:8 120;animation:flowStream 2.2s linear infinite}.packet-stream-reverse{stroke-dasharray:10 140;animation:flowStreamRev 4s linear infinite}.pulse-node{animation:pulseGlow 2.5s ease-in-out infinite alternate}.floating-card{animation:floatMotion 4s ease-in-out infinite alternate}.floating-card-alt{animation:floatMotionAlt 4.5s ease-in-out infinite alternate}</style><rect width="100%" height="100%" fill="url(#bg-grad)"/><rect width="100%" height="100%" fill="url(#grid)"/><g opacity=".35"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M -50,60 Q 300,120 600,40 T 1250,90"/><path fill="none" stroke="#38bdf8" stroke-width="3" d="M -50,60 Q 300,120 600,40 T 1250,90" class="packet-stream" filter="url(#glow)"/><path fill="none" stroke="#a855f7" stroke-width="2" d="M -50,300 Q 350,220 700,310 T 1250,240"/><path fill="none" stroke="#c084fc" stroke-width="3" d="M -50,300 Q 350,220 700,310 T 1250,240" class="packet-stream-reverse" filter="url(#glow)"/><path fill="none" stroke="#10b981" stroke-dasharray="4 6" stroke-width="1.5" d="M 100,-20 Q 250,180 500,200 T 1100,380"/><path fill="none" stroke="#34d399" stroke-width="2.5" d="M 100,-20 Q 250,180 500,200 T 1100,380" class="packet-stream-fast" filter="url(#glow)"/></g><g><circle cx="210" cy="85" r="5" fill="#38bdf8" class="pulse-node"/><circle cx="560" cy="45" r="5" fill="#00f2fe" class="pulse-node" style="animation-delay:.8s"/><circle cx="980" cy="75" r="6" fill="#818cf8" class="pulse-node" style="animation-delay:1.4s"/><circle cx="280" cy="275" r="5" fill="#c084fc" class="pulse-node" style="animation-delay:.5s"/><circle cx="780" cy="290" r="5" fill="#34d399" class="pulse-node" style="animation-delay:1.8s"/></g><g class="floating-card" opacity=".85" transform="translate(970, 40)"><rect width="180" height="38" fill="#1e293b" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" rx="8"/><circle cx="20" cy="19" r="6" fill="#10b981"/><text x="35" y="24" fill="#94a3b8" font-size="12" font-weight="600">RFC 9000 • QUIC</text></g><g class="floating-card-alt" opacity=".85" transform="translate(950, 95)"><rect width="200" height="38" fill="#1e293b" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.2" rx="8"/><circle cx="20" cy="19" r="6" fill="#38bdf8"/><text x="35" y="24" fill="#94a3b8" font-size="12" font-weight="600">RFC 9114 • HTTP/3</text></g><g class="floating-card" opacity=".85" transform="translate(965, 275)"><rect width="185" height="38" fill="#1e293b" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.2" rx="8"/><circle cx="20" cy="19" r="6" fill="#f59e0b"/><text x="35" y="24" fill="#94a3b8" font-size="12" font-weight="600">0-RTT Transport</text></g><g transform="translate(100, 52)"><rect width="365" height="28" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1" rx="14"/><text x="14" y="19" fill="#38bdf8" font-size="11.5" font-weight="700" letter-spacing="1.5">⚡ NEXT-GEN UDP &amp; TRANSPORT PROTOCOLS</text></g><g><text fill="#fff" font-size="44" font-weight="800" letter-spacing="-.5" transform="translate(100, 135)">Awesome <tspan fill="url(#cyan-blue)">HTTP/3</tspan> &amp; <tspan fill="url(#green-glow)">QUIC</tspan></text></g><g><text fill="#94a3b8" font-size="18" font-weight="400" transform="translate(100, 178)">Curated Ecosystem of Modern Transport Protocols, Edge CDNs &amp; Low-Latency Stacks</text></g><g transform="translate(100, 230)"><rect width="135" height="34" x="0" y="0" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" rx="7"/><text x="16" y="22" fill="#e2e8f0" font-size="13" font-weight="600">🚀 HTTP/3 &amp; QUIC</text><rect width="150" height="34" x="150" y="0" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" rx="7"/><text x="166" y="22" fill="#e2e8f0" font-size="13" font-weight="600">🌐 WebTransport</text><rect width="165" height="34" x="315" y="0" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" rx="7"/><text x="331" y="22" fill="#e2e8f0" font-size="13" font-weight="600">📦 QPACK Compression</text><rect width="155" height="34" x="495" y="0" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" rx="7"/><text x="511" y="22" fill="#e2e8f0" font-size="13" font-weight="600">🛡️ MASQUE Proxy</text><rect width="150" height="34" x="665" y="0" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" rx="7"/><text x="681" y="22" fill="#e2